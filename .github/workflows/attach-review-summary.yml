name: Attach Review Summary to PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    paths:
      - 'qa_agent/review_summary.json'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  post-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post review summary to PR (if present)
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');
            const path = 'qa_agent/review_summary.json';
            if (!fs.existsSync(path)) {
              core.info('No review summary found at ' + path + '. Skipping.');
              return;
            }
            const content = fs.readFileSync(path, 'utf8');
            const maxLen = 60000;
            let body = 'Review Agent Summary:\n\n';
            if (content.length > maxLen) {
              body += 'Summary is large (>60k chars). Attached as a gist is recommended.\n\n';
            }
            body += '```json\n' + content + '\n```';

            const issue_number = context.issue.number || github.context.payload.pull_request && github.context.payload.pull_request.number;
            if (!issue_number) {
              core.info('No pull request context available — skipping comment.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: body,
            });