[pytest]
asyncio_mode = auto
minversion = 6.0
addopts = -ra -q
testpaths =
    api/tests
    ui/tests
pythonpath =
    .

markers =
    regression: full regression suite (API + UI)
    sanity: quick sanity / smoke checks (API + UI)
    apiregression: API regression tests
    apisanity: API sanity tests
    uiregression: UI regression tests
    uisanity: UI sanity tests
    db: tests that need a database connection
    example: template tests shipped with the baseline
